<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./recursos/estilos/index.css">
</head>
<body>
    <header>
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/huella.png" alt="logo tienda mascotas huellitas">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>  
            <a href="./catalogo.html">
                catalogo
            </a>  
            <a href="./contacto.html">
                Contacto
            </a>     
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>
        <h2>Escribinos!!</h2>
        <form action="./contacto.html" method="post">
            <!-- 
            nombre
            telefono
            tamaño
            edad
            comportamiento de mascota
             -->
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-tel">Teléfono</label>
            <input type="tel" name="telefono" id="id-tel">
            
            <label for="id-tamaño">Tamaño mascota</label>
            <select name="tamaño-mascota" id="id-tamaño">
                <option value="C">Chico</option>
                <option value="M">Mediano</option>
                <option value="G">Grande</option>
            </select>

            <label for="id-edad">Edad</label>
            <input type="number" name="edad" id="id-edad" min="0" max="20">

            <label for="id-comentario">Comentario sobre mascota</label>
            <textarea name="comentarios" id="id-comentario"></textarea>

            <!-- Botón -->    
              <button type="reset">
                Limpiar
             </button>         
             <button type="submit">
                Enviar
             </button>
        </form>
        <h2>Dóonde estamos</h2>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6809.579612319432!2d-64.1889022!3d-31.4199168!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x9432a286a09424ab%3A0x637dd38a25e5eb11!2sBlvd.%20San%20Juan%20200%2C%20X5022%20C%C3%B3rdoba!5e0!3m2!1ses-419!2sar!4v1788354764494!5m2!1ses-419!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </main>
    <footer>
        <ul>
            <li>
                <a href="https:/instagram.com/@huellitas_ok" target="_blank">
                    @huellitas_ok
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Zona Centro
            </li>
        </ul>
    </footer>
</body>
</html>
