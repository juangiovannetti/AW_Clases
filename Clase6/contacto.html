<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas</title>
</head>
<body>
    <header>
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/huella.png" alt="logo tienda mascotas huellitas">
        </a>
        <nav>
            <a href="./index.html">
                Inicio
            </a>  
            <a href="./contacto.html">
                Contacto
            </a>     
        </nav>
    </header>
    <main>
        <h1>Contacto</h1>
        <form action="./contacto.html" method="post">
            <!-- 
            nombre
            telefono
            tamaño
            edad
            comportamiento de mascota
             -->
            <label for="id-nombre">Nombre</label>
            <input type="text" name="nombre" id="id-nombre">

            <label for="id-tel">Teléfono</label>
            <input type="tel" name="telefono" id="id-tel">
            
            <label for="id-tamaño">Tamaño mascota</label>
            <select name="tamaño-mascota" id="id-tamaño">
                <option value="C">Chico</option>
                <option value="M">Mediano</option>
                <option value="G">Grande</option>
            </select>

            <label for="id-edad">Edad</label>
            <input type="number" name="edad" id="id-edad" min="0" max="20">

            <label for="id-comentario">Comentario sobre mascota</label>
            <textarea name="comentarios" id="id-comentario"></textarea>

            <!-- Botón -->    
              <button type="reset">
                Limpiar
             </button>         
             <button type="submit">
                Enviar
             </button>
        </form>


    </main>
    <footer>
        <ul>
            <li>
                <a href="https:/instagram.com/@huellitas_ok" target="_blank">
                    @huellitas_ok
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Zona Centro
            </li>
        </ul>
    </footer>
</body>
</html>
