<!DOCTYPE html> 
<!-- Le avisa al navegador que el codigo esta escrito en HTML5, ayudando a que cargue sin errores de compatibilidad -->

<html>
<!-- Es el elemento raiz o "padre". Todo el codigo del sitio web tiene que ir obligatoriamente aca adentro -->

    <head>
        <!-- Es la "cabeza" del documento. Lo que pones aca adentro NO se ve en la pantalla, pero le da informacion vital al navegador -->
        
        <title>SisifogYM</title>
        <!-- Va siempre dentro del head. Es el texto exacto que aparece arriba de todo, en la pestaña del navegador -->
    </head>

    <body>
        <!-- Es el "cuerpo". Todo lo que pongas aca adentro es lo que el usuario SÍ va a ver renderizado en su pantalla -->
        
        <h1>SisifogYM</h1>
        <!-- "Heading 1" o titulo principal. Es el elemento con mayor jerarquia, se usa para indicar el tema principal -->
        
        <h2>Superá tus propios límites</h2>
        <!-- "Heading 2" o subtitulo. Sigue en la jerarquia y se usa para ordenar visualmente el contenido de la pagina -->
        
        <p>
            Vení a entrenar con nosotros. Contamos con máquinas de última generación, pesos libres y el mejor ambiente para que logres tus objetivos físicos de todos los días. ¡El esfuerzo nunca termina!
        </p>
        <!-- Significa "parrafo". Se usa para escribir bloques de texto normales, descripciones o explicaciones largas -->
    </body>

</html>
