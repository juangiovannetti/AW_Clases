<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huellitas - catalogo</title>
    <link rel="stylesheet" href="./recursos/estilos/index.css">
    <script type="module" src="./recursos/js/index.js"></script>
</head>
<body>
    <header class="encabezado-principal">
        <a href="./index.html" aria-label="Ir al inicio">
            <img src="./recursos/imagenes/huella.png" alt="logo tienda mascotas huellitas">
        </a>
        <nav class="vinculos">
            <a href="./index.html">
                Inicio
            </a>  
            <a href="./catalogo.html">
                catalogo
            </a>  
            <a href="./contacto.html">
                Contacto
            </a>     
        </nav>
        <!-- cantidad de productos agregados al carrito -->
        <span id="carrito">0</span>
    </header>
    <main class="contenido-principal">
        <h1>catalogo</h1>
        <section>
            <h2>productos</h2>

            <label for="filtro-talle">Talle</label>
            <select id="filtro-talle">
                <option value="">Todos</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
            </select>

            <button id="boton-evento">Evento</button>
            <dialog id="dialogo">
                <h2>Producto</h2>
                <p>Descripcion</p>
                <form method="dialog">
                    <button>Cerrar</button>
                </form>
            </dialog>

            <div id="contenedor-productos" class="contenedor-productos">
                <!-- Las tarjetas se generan desde recursos/js/index.js -->
            </div>
        </section>
        
    </main>
    <footer class="pie-principal">
        <ul>
            <li>
                <a href="https:/instagram.com/@huellitas_ok" target="_blank">
                    @huellitas_ok
                </a>
            </li>
            <li>
                Bv. San Juan 200 - Bº Zona Centro
            </li>
        </ul>
    </footer>
</body>
</html>
